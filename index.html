<style>
:root{--bg:#f1f2f8;--card:#fff;--tx:#14162a;--mut:#6b708a;--line:#e1e3ee;--acc:#5b5bf0;--bad:#e5484d;--ok:#16a37a;color-scheme:light;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c18;--card:#141729;--tx:#f1f2fa;--mut:#8b91ad;--line:#23273f;--acc:#7c7cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0c18;--card:#141729;--tx:#f1f2fa;--mut:#8b91ad;--line:#23273f;--acc:#7c7cff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:460px;padding:16px 16px 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mes{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.mes b{font-size:15px;text-transform:capitalize}
.mes button{width:36px;height:36px;border-radius:50%;background:var(--card);font-size:18px}
.mes button:disabled{opacity:.3}
.ring{position:relative;display:grid;place-items:center;margin:6px auto 4px;width:250px}
.ring .c{position:absolute;text-align:center}

.card{background:var(--card);border-radius:18px;padding:14px;margin-top:14px}
.card h3{margin:0 0 10px;font-size:14px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0}
.row+.row{border-top:1px solid var(--line)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.row .m{font-weight:700;font-size:14px;text-align:right}

.del{color:var(--mut);font-size:16px;width:30px;height:30px}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

.monto.vac{color:var(--mut)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{padding:9px 4px;border-radius:12px;background:var(--bg);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.cat span{font-size:20px}
.cat.on{border-color:var(--acc)}
input{width:100%;margin:12px 0 4px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;margin-bottom:14px}
.pad button{padding:13px 0;border-radius:12px;background:var(--bg);font-size:20px;font-weight:600}
.ok{width:100%;margin-top:12px;padding:15px;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;font-size:16px}
.ok{position:sticky;bottom:0;box-shadow:0 -12px 10px 2px var(--card)}
.ok:disabled{background:var(--line);color:var(--mut)}
.link{display:block;margin:22px auto 0;color:var(--mut);font-size:12px;text-decoration:underline}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:0 0 12px}
.sheet .seg{background:var(--bg)}

.chip.on{border-color:var(--acc)}
.hint{display:block;color:var(--mut);font-size:12px;text-align:center;margin:-4px 0 8px}
.quien small{color:var(--mut);font-size:12px;font-weight:600}
.tipos{display:flex;gap:12px}.tipos div{flex:1}.tipos small{display:block;color:var(--mut);font-size:12px}.tipos b{font-size:20px}
nav div{padding:8px 6px}nav button{padding:4px 8px}
.tf{display:flex;gap:8px;width:100%}.tf label{flex:1;min-width:0;font-size:11px;color:var(--mut);font-weight:600}.tf input{margin:2px 0 0;padding:9px 10px;font-size:14px}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:6px}.bar i{display:block;height:4px;background:var(--acc);border-radius:2px}
input[type=month]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;height:48px;text-align:left}
.acc{display:flex;flex-direction:column;align-items:flex-end}
.lab{display:block;color:var(--mut);font-size:12px;font-weight:600;margin-top:12px}
.alerta{border:1.5px solid var(--bad)}
.pagar{padding:8px 14px;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;font-size:13px}
.canc{color:var(--bad);font-size:12px;font-weight:700;padding:6px}
.addm{display:flex;gap:8px;margin-top:8px}.addm input{margin:0}.addm button{padding:0 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<nav><div>

</div></nav>
<script>
const CATS=[["Vivienda","🏠","#6366f1"],["Comida","🍽️","#f59e0b"],["Supermercado","🛒","#10b981"],["Servicios","💡","#06b6d4"],["Transporte","🚗","#ef4444"],["Compras","🛍️","#ec4899"],["Ropa","👕","#a855f7"],["Salir","🍸","#f97316"],["Entretenimiento","🎬","#3b82f6"],["Streaming","📺","#84cc16"],["Impuestos","🏛️","#64748b"],["Mantenimiento","🔧","#a16207"],["Arriendo","🔑","#0d9488"],["Deudas","💳","#be123c"],["Educación","🎓","#14b8a6"]];
const KEY="gastos.v2",KM="gastos.m2",KA="gastos.x2",PLAT=["Netflix","Disney+","Max","Prime Video","Spotify","YouTube Premium","Apple TV+"];
let D=[],M=[],A=[],T=[],I=[],C=[],R=[],rd=null,itipo="fijo",atipo="🚗",sim=null,tab="res",sub="dia",off=0,sheet=null,cf=null,ed=null,ei=null,nube={s:"chk",auto:false,ts:null,rest:null,pend:null,msg:"",ref:null,t:null},hadLocal=false;
const $=s=>document.querySelector(s),app=$("#app");
const fmt=(n,d)=>"$"+Number(n).toLocaleString("es-MX",{maximumFractionDigits:d?2:0});
const cat=n=>CATS.find(c=>c[0]===n)||CATS[0];
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem(KM,JSON.stringify(M));localStorage.setItem(KA,JSON.stringify({A,T,I,C,R}))}catch(e){}if(nube.auto)backupSoon()}
function demo(){const L=demoOld().filter(e=>!["Vivienda","Servicios"].includes(e.cat)),now=new Date(),y=now.getFullYear(),m=now.getMonth(),P=["yo","esp","hij"];
 L.forEach((e,i)=>{e.act=e.cat==="Transporte"?"a1":"";e.tar=i%3===0?"t1":"";e.tipo="diario";e.pag=P[i%2];e.con=["Supermercado","Comida"].includes(e.cat)&&i%2?P:[]});
 [["Vivienda",2800,"Renta",1,["yo","esp"],1,1],["Servicios",340,"Luz",10,P,2,0],["Streaming",219,"Netflix",5,P,1,1],["Streaming",129,"Spotify",12,P,1,1],["Servicios",450,"Internet",Math.min(28,now.getDate()+2),P,1,0]].forEach((f,i)=>{const pg=[];for(let k=2;k>=(f[6]?0:1);k--){const d=new Date(y,m-k,1);pg.push(d.getFullYear()+"-"+d.getMonth())}L.push({id:"m"+i,amt:f[1],cat:f[0],desc:f[2],ts:new Date(y,m-2,f[3],12).getTime(),tipo:"mensual",pag:"yo",con:f[4],frec:f[5],day:f[3],pg})});
 return L}
function demoOld(){const out=[],now=new Date(),y=now.getFullYear(),m=now.getMonth();
 const base=[["Vivienda",2800,"Renta"],["Comida",190,"Comida"],["Supermercado",520,"Súper semanal"],["Servicios",340,"Luz"],["Transporte",120,"Gasolina"],["Compras",410,"Compra en línea"],["Salir",260,"Cena"],["Entretenimiento",150,"Cine"],["Ropa",380,"Playera"],["Comida",95,"Café y pan"]];
 let s=7;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
 for(let k=0;k<2;k++){const mm=new Date(y,m-k,1),dias=k?28:Math.max(now.getDate(),3);
  base.forEach((b,i)=>{const day=i===0?1:1+Math.floor(rnd()*dias);if(k===0&&day>now.getDate())return;
   out.push({id:"d"+k+i,amt:Math.round(b[1]*(.8+rnd()*.4)),cat:b[0],desc:b[2],ts:new Date(y,m-k,day,12).getTime()})});
  for(let j=0;j<8;j++){const day=1+Math.floor(rnd()*dias);if(k===0&&day>now.getDate())continue;const c=CATS[1+Math.floor(rnd()*8)][0];
   out.push({id:"e"+k+j,amt:Math.round(60+rnd()*300),cat:c,desc:"",ts:new Date(y,m-k,day,18).getTime()})}}
 return out}
try{hadLocal=localStorage.getItem(KEY)!==null}catch(e){}
D=load()||[];try{M=JSON.parse(localStorage.getItem(KM))||[]}catch(e){M=[]}
if(!M.length)M=[{id:"yo",n:"Yo",e:"🙂"},{id:"esp",n:"Esposa",e:"👩"},{id:"hij",n:"Hijo",e:"🧒"}];
try{const x=JSON.parse(localStorage.getItem(KA));A=x.A||[];T=x.T||[];I=x.I||[];C=x.C||[];R=x.R||[]}catch(e){A=null}
if(!A){A=[];T=[];I=[];C=[];R=[]}
rd=rd0();
const blank=()=>({amt:"",cat:"",desc:"",tipo:"diario",pag:M[0].id,con:[],frec:1,ini:0,mi:finStr(new Date().getFullYear()*12+new Date().getMonth()),np:"",dia:new Date().getDate(),act:"",tar:"",met:"efectivo",n:1});
function monthOf(o){const d=new Date();return new Date(d.getFullYear(),d.getMonth()+o,1)}
function inMonth(dt){const y=dt.getFullYear(),mo=dt.getMonth(),n=new Date(y,mo+1,0).getDate(),out=[];
 D.forEach(e=>{const d=new Date(e.ts);
  if(e.tipo==="mensual"){const df=(y*12+mo)-(d.getFullYear()*12+d.getMonth());if(df>=0&&df%(e.frec||1)===0&&(e.fin==null||y*12+mo<=e.fin))out.push({...e,amt:((e.ch||[]).filter(x=>x.m<=y*12+mo).pop()||{a:e.amt}).a,key:y+"-"+mo,ts:new Date(y,mo,Math.min(e.day||d.getDate(),n),12).getTime()})}
  else if(d.getFullYear()===y&&d.getMonth()===mo)out.push(e)});return out}
function vFamilia(){const dt=monthOf(off),L=inMonth(dt),t=sum(L),mes=dt.toLocaleDateString("es-MX",{month:"long",year:"numeric"}),pct=v=>t?Math.round(v/t*100)+"%":"0%",
 R=(ic,n,sb,v,x)=>`<div class="row"><div class="ico" style="background:var(--bg)">${ic}</div><div class="t"><b>${n}</b><small>${sb}</small></div><div class="m">${fmt(v)}</div>${x||""}</div>`,X=(a,id)=>`<button class="del" data-a="${a}" data-v="${id}" aria-label="Quitar">✕</button>`;
 return `<div class="mes"><button data-a="mes" data-v="-1" aria-label="Mes anterior">‹</button><b>${mes}</b><button data-a="mes" data-v="1" ${off>=0?"disabled":""} aria-label="Mes siguiente">›</button></div>
 <div class="card"><h3>Gasto del hogar</h3><div class="tipos"><div><small>Total del mes</small><b>${fmt(t)}</b></div><div><small>Gastos compartidos</small><b>${fmt(sum(L.filter(e=>e.con&&e.con.length>1)))}</b></div></div></div>
 <div class="card"><h3>Familia</h3>${M.map((m,k)=>{const v=sum(L.filter(e=>e.pag===m.id));return R(m.e,m.n,pct(v)+" del gasto",v,k?X("delm",m.id):"")}).join("")}<div class="addm"><input id="nm" placeholder="Agregar miembro (ej. Hija)" maxlength="20"><button data-a="addm">Agregar</button></div><div class="hint" style="text-align:left;margin:10px 0 0">Cuando se sincronicen los dispositivos, los gastos de todos se sumarán aquí.</div></div>
 <div class="card"><h3>Activos</h3>${A.map(a=>R(a.t,a.n,"gasto del mes",sum(L.filter(e=>e.act===a.id)),X("delA",a.id))).join("")}<div class="chips">${[["🚗","Carro"],["🏠","Casa"],["🏪","Local"]].map(x=>`<button class="chip ${atipo===x[0]?"on":""}" data-a="atipo" data-v="${x[0]}">${x[0]} ${x[1]}</button>`).join("")}</div><div class="addm"><input id="na" placeholder="Nombre (ej. Carro 2, Local centro)" maxlength="30"><button data-a="addA">Agregar</button></div></div>
 <div class="card"><h3>Tarjetas de crédito</h3>${T.map(c=>R("💳",c.n,"cargado este mes",sum(L.filter(e=>e.tar===c.id)),X("delT",c.id))).join("")}<div class="addm"><input id="nt" placeholder="Nombre (ej. Visa Banco X)" maxlength="30"><button data-a="addT">Agregar</button></div></div>`}
function vFamiliaOld(){const dt=monthOf(off),L=inMonth(dt),paid={},owe={};M.forEach(m=>{paid[m.id]=0;owe[m.id]=0});
 L.forEach(e=>{const c=(e.con&&e.con.length?e.con:[e.pag]).filter(x=>x in owe);if(!c.length||!(e.pag in paid))return;paid[e.pag]+=e.amt;c.forEach(x=>owe[x]+=e.amt/c.length)});
 const net=M.map(m=>({m,v:paid[m.id]-owe[m.id]})),cr=net.filter(x=>x.v>.5).map(x=>({...x})).sort((a,b)=>b.v-a.v),dd=net.filter(x=>x.v<-.5).map(x=>({...x,v:-x.v})).sort((a,b)=>b.v-a.v),pay=[];
 let i=0,j=0;while(i<dd.length&&j<cr.length){const t=Math.min(dd[i].v,cr[j].v);pay.push(`${dd[i].m.e} ${dd[i].m.n} le debe ${fmt(t)} a ${cr[j].m.e} ${cr[j].m.n}`);dd[i].v-=t;cr[j].v-=t;if(dd[i].v<.5)i++;if(cr[j].v<.5)j++}
 const mes=dt.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
 return `<div class="mes"><button data-a="mes" data-v="-1" aria-label="Mes anterior">‹</button><b>${mes}</b><button data-a="mes" data-v="1" ${off>=0?"disabled":""} aria-label="Mes siguiente">›</button></div>
 <div class="card"><h3>Cuentas del mes</h3>${pay.length?pay.map(p=>`<div class="row"><div class="t"><b>${p}</b></div></div>`).join(""):`<div class="vacio" style="padding:14px">Todos están a mano.</div>`}</div>
 <div class="card"><h3>Familia</h3>${M.map((m,k)=>`<div class="row"><div class="ico" style="background:var(--bg)">${m.e}</div><div class="t"><b>${m.n}</b><small>Pagó ${fmt(paid[m.id])} · le corresponde ${fmt(owe[m.id])}</small></div><div class="m" style="color:${net[k].v>=0?"var(--ok)":"var(--bad)"}">${net[k].v>=0?"+":"−"}${fmt(Math.abs(net[k].v))}</div>${k?`<button class="del" data-a="delm" data-v="${m.id}" aria-label="Quitar">✕</button>`:""}</div>`).join("")}
 <div class="addm"><input id="nm" placeholder="Agregar miembro (ej. Hija)" maxlength="20"><button data-a="addm">Agregar</button></div></div>
 <div class="vacio" style="padding:8px 8px 0;font-size:12px">Al registrar un gasto elige quién pagó y entre quiénes se divide.</div>`}
const sum=a=>a.reduce((t,e)=>t+e.amt,0);
function donut(items,total){const r=88,C=2*Math.PI*r;let acc=0,segs="";
 if(!total)segs=`<circle r="${r}" fill="none" stroke="var(--line)" stroke-width="22"/>`;
 else items.forEach(([n,v])=>{const len=v/total*C,gap=items.length>1?3:0;
  segs+=`<circle r="${r}" fill="none" stroke="${cat(n)[2]}" stroke-width="22" stroke-dasharray="${Math.max(len-gap,0.5)} ${C}" stroke-dashoffset="${-acc}"/>`;acc+=len});
 return `<svg viewBox="-125 -125 250 250" width="250" height="250"><g transform="rotate(-90)">${segs}</g></svg>`}
function bars(list,dt){const n=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate(),v=Array(n).fill(0);
 list.forEach(e=>v[new Date(e.ts).getDate()-1]+=e.amt);const mx=Math.max(...v,1),w=300/n;
 return `<svg viewBox="0 0 300 80" width="100%" height="80" preserveAspectRatio="none">`+v.map((x,i)=>`<rect x="${i*w+w*.15}" y="${78-x/mx*74}" width="${w*.7}" height="${Math.max(x/mx*74,1.5)}" rx="1.5" fill="var(--acc)" opacity="${x?1:.25}"/>`).join("")+`</svg>`}
function vResumen(){const dt=monthOf(off),L=inMonth(dt),t=sum(L),p=sum(inMonth(monthOf(off-1)));
 const by={};L.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amt);const items=Object.entries(by).sort((a,b)=>b[1]-a[1]);
 const mes=dt.toLocaleDateString("es-MX",{month:"long",year:"numeric"});
 let dl="";if(p&&t){const x=Math.round((t-p)/p*100);dl=`<div class="delta" style="color:${x>0?"var(--bad)":"var(--ok)"}">${x>0?"▲":"▼"} ${Math.abs(x)}% frente al mes anterior</div>`}
 return `<div class="mes"><button data-a="mes" data-v="-1" aria-label="Mes anterior">‹</button><b>${mes}</b><button data-a="mes" data-v="1" ${off>=0?"disabled":""} aria-label="Mes siguiente">›</button></div>
 <div class="ring">${donut(items,t)}<div class="c"><small>Gastado</small><strong>${fmt(t)}</strong>${dl}</div></div>
 <div class="card tipos"><div><small>Pagos mensuales</small><b>${fmt(sum(L.filter(e=>e.tipo==="mensual")))}</b></div><div><small>Gasto diario</small><b>${fmt(sum(L.filter(e=>e.tipo!=="mensual")))}</b></div></div>
